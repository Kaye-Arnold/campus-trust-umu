name: campustrust
description: CampusTrust — Trust-Based Local Service Finder for UMU Nkozi
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  google_sign_in: ^6.2.1
  provider: ^6.1.2
  url_launcher: ^6.3.0
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1  # <-- Add this!
  flutter_native_splash: ^2.4.1    # <-- And add this!

flutter:
  uses-material-design: true

  # --- APP ICON CONFIGURATION ---
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icons/app_icon.png" # Added /icons/ here!
  min_sdk_android: 21

# --- SPLASH SCREEN CONFIGURATION ---
flutter_native_splash:
  color: "#0F172A"
  image: "assets/icons/splash_logo.png"   # Added /icons/ here!
  android_12:
    image: "assets/icons/splash_logo.png" # Added /icons/ here!
    icon_background_color: "#0F172A"